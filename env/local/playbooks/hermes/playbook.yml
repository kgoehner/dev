---
- hosts: hermes_servers
  become: yes
  vars_files:
    - vault.yml
  vars:
    docker_compose_dir: /srv/docker
    timezone: America/New_York
    pihole_webpassword: "{{ vault_pihole_password }}"
  roles:
    - { role: preflight, tags: ['core', 'infrastructure'] }
    - { role: docker, tags: ['core', 'infrastructure'] }
    - { role: portainer, tags: ['core', 'infrastructure'] }
    - { role: pihole, tags: ['core', 'infrastructure', 'dns'] }
    - { role: paperless, tags: ['productivity'] }
    - { role: jellyfin, tags: ['media'] }
    - { role: prowlarr, tags: ['media', 'torrenting'] }
    - { role: sonarr, tags: ['media', 'torrenting'] }
    - { role: radarr, tags: ['media', 'torrenting'] }
    - { role: lidarr, tags: ['media', 'torrenting'] }
    - { role: nextcloud, tags: ['productivity'] }
    - { role: torrenting, tags: ['media', 'torrenting-core'] }
    - { role: filebrowser, tags: ['media', 'files'] }
    - { role: immich, tags: ['media', 'photos'] }
    - { role: bitwarden, tags: ['security'] }
    - { role: linkding, tags: ['productivity'] }
    - { role: uptime-kuma, tags: ['core', 'monitoring'] }
    - { role: monitoring, tags: ['monitoring', 'metrics'] }
    - { role: homer, tags: ['core', 'dashboard'] }
    - { role: wireguard, tags: ['security', 'vpn'] }
    - { role: nginx, tags: ['core', 'infrastructure', 'proxy'] }
    # - restic
