---
- name: Create uptime-kuma directory
  file:
    path: "{{ docker_compose_dir }}/uptime-kuma"
    state: directory
    mode: '0755'

- name: Deploy uptime-kuma docker-compose
  template:
    src: docker-compose.yml.j2
    dest: "{{ docker_compose_dir }}/uptime-kuma/docker-compose.yml"
    mode: '0644'

- name: Start uptime-kuma
  community.docker.docker_compose_v2:
    project_src: "{{ docker_compose_dir }}/uptime-kuma"
    state: present
