---
- name: Create Nextcloud directory
  file:
    path: "{{ docker_compose_dir }}/nextcloud"
    state: directory
    mode: '0755'

- name: Deploy Nextcloud docker-compose.yml
  template:
    src: docker-compose.yml.j2
    dest: "{{ docker_compose_dir }}/nextcloud/docker-compose.yml"
    mode: '0644'

- name: Pull latest Nextcloud image
  community.docker.docker_compose_v2:
    project_src: "{{ docker_compose_dir }}/nextcloud"
    pull: always
  when: not ansible_check_mode
  tags: ['update']

- name: Start Nextcloud stack
  community.docker.docker_compose_v2:
    project_src: "{{ docker_compose_dir }}/nextcloud"
    state: present
  when: not ansible_check_mode
