---
- name: Install restic
  apt:
    name: restic
    state: present
    update_cache: yes

- name: Create restic config directory
  file:
    path: /etc/restic
    state: directory
    mode: '0700'

- name: Deploy restic environment file
  template:
    src: restic-env.j2
    dest: /etc/restic/env
    mode: '0600'

- name: Check if repository is initialized
  shell: |
    . /etc/restic/env
    restic snapshots
  args:
    executable: /bin/bash
  register: repo_check
  failed_when: false
  changed_when: false

- name: Initialize restic repository
  shell: |
    . /etc/restic/env
    restic init
  args:
    executable: /bin/bash
  when: repo_check.rc != 0

- name: Deploy backup script
  template:
    src: backup.sh.j2
    dest: /usr/local/bin/restic-backup
    mode: '0755'

- name: Create backup log directory
  file:
    path: /var/log/restic
    state: directory
    mode: '0755'

- name: Setup backup cron job every 6 hours
  cron:
    name: "Restic backup every 6 hours"
    minute: "0"
    hour: "*/6"
    job: "/usr/local/bin/restic-backup >> /var/log/restic/backup.log 2>&1"
