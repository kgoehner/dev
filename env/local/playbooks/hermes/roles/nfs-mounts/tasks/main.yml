---
- name: Install NFS client
  apt:
    name: nfs-common
    state: present

- name: Create NFS mount directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /mnt/atlas/media
    - /mnt/atlas/backups
    - /mnt/atlas/documents
    - /mnt/atlas/photos

- name: Mount NFS shares
  mount:
    path: "{{ item.path }}"
    src: "{{ item.src }}"
    fstype: nfs
    opts: "rw,hard,intr,vers=4.1,rsize=1048576,wsize=1048576,timeo=14"
    state: mounted
  loop:
    - { path: "/mnt/atlas/media", src: "atlas.local:/volume1/media" }
    - { path: "/mnt/atlas/backups", src: "atlas.local:/volume1/backups" }
    - { path: "/mnt/atlas/documents", src: "atlas.local:/volume1/documents" }
    - { path: "/mnt/atlas/photos", src: "atlas.local:/volume1/photos" }
  ignore_errors: yes
