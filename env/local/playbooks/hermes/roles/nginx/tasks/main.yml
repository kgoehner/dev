---
- name: Create Nginx directory
  file:
    path: "{{ docker_compose_dir }}/nginx"
    state: directory
    mode: '0755'

- name: Deploy Nginx config
  template:
    src: nginx.conf.j2
    dest: "{{ docker_compose_dir }}/nginx/nginx.conf"
    mode: '0644'

- name: Deploy Nginx docker-compose.yml
  template:
    src: docker-compose.yml.j2
    dest: "{{ docker_compose_dir }}/nginx/docker-compose.yml"
    mode: '0644'

- name: Start Nginx stack
  community.docker.docker_compose_v2:
    project_src: "{{ docker_compose_dir }}/nginx"
    state: present
    recreate: always
  when: not ansible_check_mode
