unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# use 256 colors
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# window/pane numbering starts at 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# vim-like copy paste - use prefix [
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# vim-like pane switching
bind-key -r p last-window
bind-key -r k select-pane -U
bind-key -r j select-pane -D
bind-key -r h select-pane -L
bind-key -r l select-pane -R

# edit todo
bind-key -r D neww -c "#{pane_current_path}" "[[ -e TODO.md ]] && nvim TODO.md || nvim ~/.dotfiles/personal/todo.md"

bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
bind-key -r i run-shell "tmux neww ~/.local/bin/tmux-cht.sh"

# status bar — gruvbox dark hard palette
set -g status-position top
set -g status-interval 5
set -g status-style "bg=#928374,fg=#fbf1c7"

set -g status-left-length 30
set -g status-left "#[bg=#928374,fg=#fbf1c7,bold][ #S ] "

set -g status-right-length 30
set -g status-right "#[bg=#928374,fg=#fbf1c7]%a %d %b %H:%M "

set -g window-status-format "#[bg=#928374,fg=#ebdbb2] #I:#W "
set -g window-status-current-format "#[bg=#928374,fg=#fbf1c7,bold] #I:#W#F "

set -g status-justify left

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

run '~/.config/tmux/plugins/tpm/tpm'
